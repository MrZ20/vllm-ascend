name: Doc Test

on:
  workflow_dispatch:
    inputs:
      quickstart_device:
        description: Quick Start device to test
        required: true
        type: choice
        default: none
        options:
          - none
          - a2
          - 310p
      installation_method:
        description: Installation method to test
        required: true
        type: choice
        default: none
        options:
          - none
          - pip
          - uv
          - source
  workflow_call:
    inputs:
      quickstart_device:
        description: Quick Start device to test, or none
        required: false
        type: string
        default: none
      installation_method:
        description: Installation method to test, or none
        required: false
        type: string
        default: none
  pull_request:
    branches:
      - main
      - 'releases/v*'
    paths:
      - '.github/workflows/labeled_doctest.yaml'
      - 'mkdocs.yml'
      - 'docs/source/getting_started/**'
      - 'tests/e2e/common.sh'
      - 'tests/e2e/run_doctests.sh'
      - 'tests/e2e/doctests/001-quickstart-test.sh'
      - 'tests/e2e/doctests/002-installation-test.sh'
      - 'tests/e2e/doctests/doctest_helper.py'

permissions:
  contents: read

defaults:
  run:
    shell: bash -el {0}

concurrency:
  group: doctest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select doctests
    runs-on: linux-amd64-cpu-4-hk
    outputs:
      quickstart: ${{ steps.select.outputs.quickstart }}
      installation: ${{ steps.select.outputs.installation }}
      run_quickstart: ${{ steps.select.outputs.run_quickstart }}
      run_installation: ${{ steps.select.outputs.run_installation }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Select tests and build matrices
        id: select
        env:
          DOCTEST_EVENT: ${{ github.event_name }}
          DOCTEST_BASE_REF: ${{ github.event.pull_request.base.sha }}
          DOCTEST_HEAD_REF: ${{ github.event.pull_request.head.sha }}
          DOCTEST_QUICKSTART_DEVICE: ${{ inputs.quickstart_device }}
          DOCTEST_INSTALLATION_METHOD: ${{ inputs.installation_method }}
        run: |
          quickstart_devices=()
          installation_methods=()

          add_unique() {
            local -n values="$1"
            local value="$2"
            local item
            for item in "${values[@]}"; do
              [[ "${item}" == "${value}" ]] && return
            done
            values+=("${value}")
          }

          if [[ "${DOCTEST_EVENT}" == "pull_request" ]]; then
            quickstart_selection="$(
              bash tests/e2e/doctests/001-quickstart-test.sh \
                select "${DOCTEST_BASE_REF}" "${DOCTEST_HEAD_REF}"
            )"
            installation_selection="$(
              bash tests/e2e/doctests/002-installation-test.sh \
                select "${DOCTEST_BASE_REF}" "${DOCTEST_HEAD_REF}"
            )"
            if [[ -n "${quickstart_selection}" ]]; then
              mapfile -t quickstart_devices <<<"${quickstart_selection}"
            fi
            if [[ -n "${installation_selection}" ]]; then
              mapfile -t installation_methods <<<"${installation_selection}"
            fi

            shared_tooling_changed=false
            if git diff --quiet "${DOCTEST_BASE_REF}" "${DOCTEST_HEAD_REF}" -- \
              .github/workflows/labeled_doctest.yaml \
              tests/e2e/common.sh \
              tests/e2e/run_doctests.sh \
              tests/e2e/doctests/doctest_helper.py
            then
              :
            else
              command_status=$?
              if [[ ${command_status} -eq 1 ]]; then
                shared_tooling_changed=true
              else
                exit "${command_status}"
              fi
            fi

            release_changed=false
            if python3 tests/e2e/doctests/doctest_helper.py \
              release-changed "${DOCTEST_BASE_REF}" "${DOCTEST_HEAD_REF}"
            then
              release_changed=true
            else
              command_status=$?
              [[ ${command_status} -eq 1 ]] || exit "${command_status}"
            fi

            if [[ "${release_changed}" == true || "${shared_tooling_changed}" == true ]]; then
              # Release values form one compatible stack. Validate both Quick
              # Start hardware paths and source installation as smoke coverage.
              add_unique quickstart_devices a2
              add_unique quickstart_devices 310p
              add_unique installation_methods source
            fi
          else
            case "${DOCTEST_QUICKSTART_DEVICE}" in
              none) ;;
              a2|310p) quickstart_devices+=("${DOCTEST_QUICKSTART_DEVICE}") ;;
              *) echo "Invalid Quick Start device: ${DOCTEST_QUICKSTART_DEVICE}" >&2; exit 1 ;;
            esac
            case "${DOCTEST_INSTALLATION_METHOD}" in
              none) ;;
              pip|uv|source) installation_methods+=("${DOCTEST_INSTALLATION_METHOD}") ;;
              *) echo "Invalid Installation method: ${DOCTEST_INSTALLATION_METHOD}" >&2; exit 1 ;;
            esac
          fi

          vllm_ascend_version="$(
            python3 tests/e2e/doctests/doctest_helper.py \
              extra vllm_ascend_version
          )"
          release_cann_version="$(
            python3 tests/e2e/doctests/doctest_helper.py \
              extra release_cann_version
          )"
          release_image_python_version="$(
            python3 tests/e2e/doctests/doctest_helper.py \
              extra release_image_python_version
          )"

          quickstart_rows='[]'
          for device in "${quickstart_devices[@]}"; do
            case "${device}" in
              a2) runner=linux-aarch64-a2b3-1 ;;
              310p) runner=linux-aarch64-310p-1 ;;
            esac
            for os_variant in ubuntu openeuler; do
              image_tag="${vllm_ascend_version}"
              [[ "${device}" == "310p" ]] && image_tag+="-310p"
              [[ "${os_variant}" == "openeuler" ]] && image_tag+="-openeuler"
              row="$(jq -cn \
                --arg device "${device}" \
                --arg os "${os_variant}" \
                --arg runner "${runner}" \
                --arg image_tag "${image_tag}" \
                '{device:$device, os:$os, runner:$runner, image_tag:$image_tag}')"
              quickstart_rows="$(jq -c --argjson row "${row}" '. + [$row]' <<<"${quickstart_rows}")"
            done
          done

          installation_rows='[]'
          for method in "${installation_methods[@]}"; do
            for os_variant in ubuntu openeuler; do
              case "${os_variant}" in
                ubuntu) os_tag=ubuntu22.04 ;;
                openeuler) os_tag=openeuler24.03 ;;
              esac
              image_tag="${release_cann_version}-910b-${os_tag}-py${release_image_python_version}"
              row="$(jq -cn \
                --arg method "${method}" \
                --arg os "${os_variant}" \
                --arg runner linux-aarch64-a2b3-1 \
                --arg image_tag "${image_tag}" \
                '{method:$method, os:$os, runner:$runner, image_tag:$image_tag}')"
              installation_rows="$(jq -c --argjson row "${row}" '. + [$row]' <<<"${installation_rows}")"
            done
          done

          quickstart_matrix="$(jq -cn --argjson rows "${quickstart_rows}" '{include:$rows}')"
          installation_matrix="$(jq -cn --argjson rows "${installation_rows}" '{include:$rows}')"
          run_quickstart=false
          run_installation=false
          [[ ${#quickstart_devices[@]} -gt 0 ]] && run_quickstart=true
          [[ ${#installation_methods[@]} -gt 0 ]] && run_installation=true
          {
            echo "quickstart=${quickstart_matrix}"
            echo "installation=${installation_matrix}"
            echo "run_quickstart=${run_quickstart}"
            echo "run_installation=${run_installation}"
          } >>"${GITHUB_OUTPUT}"

          {
            echo '## Doctest matrices'
            echo
            echo '```json'
            jq -n \
              --argjson quickstart "${quickstart_matrix}" \
              --argjson installation "${installation_matrix}" \
              '{quickstart:$quickstart, installation:$installation}'
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"

  quickstart:
    name: Quick Start (${{ matrix.device }}, ${{ matrix.os }})
    needs: select
    if: needs.select.outputs.run_quickstart == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.quickstart) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend:${{ matrix.image_tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Show test environment
        run: |
          echo "Device: ${{ matrix.device }}"
          echo "OS: ${{ matrix.os }}"
          echo "Image tag: ${{ matrix.image_tag }}"
          npu-smi info

      - name: Run Quick Start doctest
        run: |
          runtime_dir="$(mktemp -d)"
          cd "${runtime_dir}"
          bash "${GITHUB_WORKSPACE}/tests/e2e/run_doctests.sh" \
            quickstart "${{ matrix.device }}"

  installation:
    name: Installation (${{ matrix.method }}, ${{ matrix.os }})
    needs: select
    if: needs.select.outputs.run_installation == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.installation) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:${{ matrix.image_tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Show test environment
        run: |
          echo "Method: ${{ matrix.method }}"
          echo "OS: ${{ matrix.os }}"
          echo "Image tag: ${{ matrix.image_tag }}"
          npu-smi info

      - name: Run Installation doctest
        run: |
          runtime_dir="$(mktemp -d)"
          cd "${runtime_dir}"
          bash "${GITHUB_WORKSPACE}/tests/e2e/run_doctests.sh" \
            installation "${{ matrix.method }}"
