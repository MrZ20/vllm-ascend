# SPDX-License-Identifier: Apache-2.0
name: qwen32-w8a8
model: vllm-ascend/Qwen3-32B-W8A8
server_cmd: vllm serve vllm-ascend/Qwen3-32B-W8A8 --served-model-name vllm-ascend/Qwen3-32B-W8A8 --host 0.0.0.0
  --port {{ LaunchContext.port }} --tensor-parallel-size 4 --quantization ascend --enforce-eager --max-model-len
  40960 --max-num-batched-tokens 40960 --max-num-seqs 80 --gpu-memory-utilization 0.9 --block-size 128 --trust-remote-code
  --no-enable-prefix-caching
envs:
  HCCL_OP_EXPANSION_MODE: AIV
  OMP_NUM_THREADS: '1'
  PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
endpoint:
  host: '{{ NodeContext.ip }}'
  port: auto
test_content:
- chat_completion
prompts:
- Say hello briefly.
api_keyword_args:
  max_tokens: 16
  temperature: 0
benchmarks:
  acc:
    case_type: accuracy
    dataset_path: vllm-ascend/gsm8k-lite
    request_conf: vllm_api_general_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_noncot_chat_prompt
    max_out_len: 10240
    batch_size: 32
    baseline: 96
    threshold: 10
  perf:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K-in3500-bs400
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 304
    max_out_len: 1500
    batch_size: 76
    baseline: 1147.8159
    threshold: 0.97
