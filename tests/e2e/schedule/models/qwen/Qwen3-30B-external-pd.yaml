# SPDX-License-Identifier: Apache-2.0
name: qwen30-external-pd
model: vllm-ascend/Qwen3-30B-A3B-W8A8
test_content:
- chat_completion
prompts:
- Say hello briefly.
api_keyword_args:
  max_tokens: 16
  temperature: 0
benchmarks:
  smoke:
    case_type: performance
    dataset_path: vllm-ascend/gsm8k
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 2
    max_out_len: 16
    batch_size: 1
    baseline: 0
    threshold: 0
deployment:
  services:
    p:
      launch_strategy: external_dp_rank
      launches:
        node0:
          server_cmd: 'vllm serve vllm-ascend/Qwen3-30B-A3B-W8A8 --host 0.0.0.0 --port {{ LaunchContext.port
            }} --quantization ascend --enforce-eager --trust-remote-code --max-model-len 2048 --max-num-batched-tokens
            2048 --max-num-seqs 4 --gpu-memory-utilization 0.7 --block-size 128 --no-enable-prefix-caching
            --tensor-parallel-size 1 --data-parallel-size 2 --data-parallel-size-local 1 --data-parallel-address
            {{ ServiceContext.coordinator_ip }} --data-parallel-rpc-port 23380 --enable-expert-parallel --data-parallel-rank
            {{ LaunchContext.dp_rank }} --kv-transfer-config ''{"kv_connector": "MooncakeConnectorV1", "kv_role":
            "kv_producer", "kv_port": 30000, "kv_connector_extra_config": {"prefill": {"dp_size": 2, "tp_size":
            1}, "decode": {"dp_size": 2, "tp_size": 1}}}'''
          endpoint:
            host: '{{ NodeContext.ip }}'
            port: '{{ LaunchContext.port }}'
          envs:
            VLLM_HOST_IP: '{{ NodeContext.ip }}'
            HCCL_IF_IP: '{{ NodeContext.ip }}'
            GLOO_SOCKET_IFNAME: '{{ NodeContext.nic_name }}'
            TP_SOCKET_IFNAME: '{{ NodeContext.nic_name }}'
            HCCL_SOCKET_IFNAME: '{{ NodeContext.nic_name }}'
            HCCL_OP_EXPANSION_MODE: AIV
            OMP_NUM_THREADS: '1'
            HCCL_BUFFSIZE: '256'
            PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
          expansion:
            dp_size: 2
            dp_size_local: 2
            dp_rank_start: 0
            port_start: 18380
            dp_rpc_port: 23380
            tp_size: 1
    d:
      launch_strategy: external_dp_rank
      launches:
        node1:
          server_cmd: 'vllm serve vllm-ascend/Qwen3-30B-A3B-W8A8 --host 0.0.0.0 --port {{ LaunchContext.port
            }} --quantization ascend --enforce-eager --trust-remote-code --max-model-len 2048 --max-num-batched-tokens
            2048 --max-num-seqs 4 --gpu-memory-utilization 0.7 --block-size 128 --no-enable-prefix-caching
            --tensor-parallel-size 1 --data-parallel-size 2 --data-parallel-size-local 1 --data-parallel-address
            {{ ServiceContext.coordinator_ip }} --data-parallel-rpc-port 23381 --enable-expert-parallel --data-parallel-rank
            {{ LaunchContext.dp_rank }} --kv-transfer-config ''{"kv_connector": "MooncakeConnectorV1", "kv_role":
            "kv_consumer", "kv_port": 30200, "kv_connector_extra_config": {"prefill": {"dp_size": 2, "tp_size":
            1}, "decode": {"dp_size": 2, "tp_size": 1}}}'''
          endpoint:
            host: '{{ NodeContext.ip }}'
            port: '{{ LaunchContext.port }}'
          envs:
            VLLM_HOST_IP: '{{ NodeContext.ip }}'
            HCCL_IF_IP: '{{ NodeContext.ip }}'
            GLOO_SOCKET_IFNAME: '{{ NodeContext.nic_name }}'
            TP_SOCKET_IFNAME: '{{ NodeContext.nic_name }}'
            HCCL_SOCKET_IFNAME: '{{ NodeContext.nic_name }}'
            HCCL_OP_EXPANSION_MODE: AIV
            OMP_NUM_THREADS: '1'
            HCCL_BUFFSIZE: '256'
            PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
          expansion:
            dp_size: 2
            dp_size_local: 2
            dp_rank_start: 0
            port_start: 18380
            dp_rpc_port: 23381
            tp_size: 1
  routing:
    type: disaggregated_prefill
    groups:
      prefiller:
      - p
      decoder:
      - d
    proxy:
      command: python $REPO_ROOT/examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py --host
        0.0.0.0 --port {{ LaunchContext.port }} --prefiller-hosts {{ PDRoutingContext.prefiller_hosts }} --prefiller-ports
        {{ PDRoutingContext.prefiller_ports }} --decoder-hosts {{ PDRoutingContext.decoder_hosts }} --decoder-ports
        {{ PDRoutingContext.decoder_ports }}
      endpoint:
        host: '{{ NodeContext.ip }}'
        port: 18390
