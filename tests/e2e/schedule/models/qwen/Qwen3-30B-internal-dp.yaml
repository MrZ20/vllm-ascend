# SPDX-License-Identifier: Apache-2.0
name: qwen30-internal-dp
model: vllm-ascend/Qwen3-30B-A3B-W8A8
test_content:
- chat_completion
prompts:
- Say hello briefly.
api_keyword_args:
  max_tokens: 16
  temperature: 0
benchmarks:
  smoke:
    case_type: performance
    dataset_path: vllm-ascend/gsm8k
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 2
    max_out_len: 16
    batch_size: 1
    baseline: 0
    threshold: 0
deployment:
  services:
    main:
      launch_strategy: explicit
      launches:
        node0:
          server_cmd: vllm serve vllm-ascend/Qwen3-30B-A3B-W8A8 --host 0.0.0.0 --port {{ LaunchContext.port
            }}  --quantization ascend --enforce-eager --trust-remote-code --max-model-len 2048 --max-num-batched-tokens
            2048 --max-num-seqs 4 --gpu-memory-utilization 0.7 --block-size 128 --no-enable-prefix-caching
            --tensor-parallel-size 2 --data-parallel-size 2 --data-parallel-size-local 1 --data-parallel-address
            {{ ServiceContext.coordinator_ip }} --data-parallel-rpc-port 23380 --enable-expert-parallel
          endpoint:
            host: '{{ NodeContext.ip }}'
            port: 18380
          envs:
            VLLM_HOST_IP: '{{ NodeContext.ip }}'
            HCCL_IF_IP: '{{ NodeContext.ip }}'
            GLOO_SOCKET_IFNAME: '{{ NodeContext.nic_name }}'
            TP_SOCKET_IFNAME: '{{ NodeContext.nic_name }}'
            HCCL_SOCKET_IFNAME: '{{ NodeContext.nic_name }}'
            HCCL_OP_EXPANSION_MODE: AIV
            OMP_NUM_THREADS: '1'
            HCCL_BUFFSIZE: '256'
            PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
        node1:
          server_cmd: vllm serve vllm-ascend/Qwen3-30B-A3B-W8A8 --host 0.0.0.0 --headless  --quantization ascend
            --enforce-eager --trust-remote-code --max-model-len 2048 --max-num-batched-tokens 2048 --max-num-seqs
            4 --gpu-memory-utilization 0.7 --block-size 128 --no-enable-prefix-caching --tensor-parallel-size
            2 --data-parallel-size 2 --data-parallel-size-local 1 --data-parallel-address {{ ServiceContext.coordinator_ip
            }} --data-parallel-rpc-port 23380 --enable-expert-parallel --data-parallel-start-rank 1
          endpoint: null
          envs:
            VLLM_HOST_IP: '{{ NodeContext.ip }}'
            HCCL_IF_IP: '{{ NodeContext.ip }}'
            GLOO_SOCKET_IFNAME: '{{ NodeContext.nic_name }}'
            TP_SOCKET_IFNAME: '{{ NodeContext.nic_name }}'
            HCCL_SOCKET_IFNAME: '{{ NodeContext.nic_name }}'
            HCCL_OP_EXPANSION_MODE: AIV
            OMP_NUM_THREADS: '1'
            HCCL_BUFFSIZE: '256'
            PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
